<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#075DFF" />
    <title>Offline | MyDhobi Admin</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f7faff;
        color: #0b1e57;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        text-align: center;
      }

      img {
        width: 72px;
        height: 72px;
        object-fit: contain;
      }

      h1 {
        margin: 24px 0 8px;
        font-size: 28px;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: #5a6b8c;
        font-size: 15px;
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        margin-top: 24px;
        border-radius: 6px;
        background: #075dff;
        color: white;
        padding: 0 18px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="MyDhobi" />
      <h1>You are offline</h1>
      <p>Reconnect to continue using the MyDhobi admin dashboard.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
